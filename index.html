<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">

<title>LSC Int'l Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column built for a thumb. Tabs scroll sideways; counters and contacts are large tap rows. */
:root{
  --bg:#f1f4f3; --panel:#ffffff; --fg:#13201b; --muted:#566660; --line:#d9e1dd;
  --accent:#0f766e; --accent-soft:#d5ede8; --track:#e3e9e6; --on-accent:#ffffff; --warn:#9a5b00; --warn-soft:#fbeccb;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --panel:#151f1b; --fg:#e5eee9; --muted:#8fa299; --line:#25332d;
  --accent:#3fc7b6; --accent-soft:#16332e; --track:#22302b; --on-accent:#08201c; --warn:#f0b955; --warn-soft:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --panel:#151f1b; --fg:#e5eee9; --muted:#8fa299; --line:#25332d;
  --accent:#3fc7b6; --accent-soft:#16332e; --track:#22302b; --on-accent:#08201c; --warn:#f0b955; --warn-soft:#3a2d12; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:0}
.sync{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:10px 0;min-height:44px;cursor:pointer;text-align:right}
.take{margin:6px 0 16px;color:var(--muted)}
.take b{color:var(--fg);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-weight:500;font-size:15px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 6px;margin-bottom:14px}
.grp>header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
h2{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0}
.reset{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:10px 0 10px 10px;min-height:44px;cursor:pointer}
.reset.arm{color:var(--accent);font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lbl{font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:6px}
.btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.btn.plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:active{transform:scale(.96)}
.num{min-width:68px;text-align:center;font-variant-numeric:tabular-nums}
.num b,.num .cnt{font-family:var(--font-display);font-size:24px;font-weight:700}
.num .cnt{width:3.4ch;min-width:44px;padding:2px 0;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--fg);text-align:right;-moz-appearance:textfield;appearance:textfield;border-radius:0}
.num .cnt::-webkit-outer-spin-button,.num .cnt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .cnt:focus{outline:2px solid var(--accent);outline-offset:2px;border-bottom-color:transparent}
.num span{color:var(--muted);font-size:14px}
.hit .num b,.hit .num .cnt{color:var(--accent)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;min-height:56px;cursor:pointer}
.stat:first-of-type{border-top:0}
.chip{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:6px 12px;background:var(--track);color:var(--muted)}
.chip.s1,.chip.on{background:var(--accent-soft);color:var(--accent)}
.chip.s2{background:var(--accent);color:var(--on-accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:2px 0 12px}
/* outreach */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .n{font-family:var(--font-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.tile .n small{font-size:14px;color:var(--muted);font-weight:500}
.tile .t{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.fchip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
.search{margin-bottom:12px}
.item{border-top:1px solid var(--line)}
.ihead{display:flex;align-items:center;gap:8px}
.irow{flex:1;min-width:0;display:block;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:10px 0;min-height:56px;cursor:pointer}
.iname{display:block;font-weight:500;overflow-wrap:anywhere}
.isub{display:block;font-size:13px;color:var(--muted)}
.qt{display:flex;gap:6px;flex:none}
.qt button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.panel{display:grid;gap:12px;padding:2px 0 16px}
.f{display:grid;gap:4px}
.f>label{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;min-height:44px}
.checks input{width:22px;height:22px;min-height:0;padding:0}
.primary{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;min-height:48px;padding:0 18px;cursor:pointer}
.ghost{font:inherit;font-weight:500;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
.ghost[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.links,.tagrow{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;color:var(--accent);text-decoration:none;font-weight:500}
.bubble{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bubble .msg{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble button{flex:none}
details{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500}
details .body{padding:0 0 12px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px}
.more{width:100%;margin:12px 0}
.empty{padding:18px 0;color:var(--muted)}
.ref{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.ref h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:16px}
.ref .who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ref p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;max-width:calc(100% - 32px);z-index:5}
.err{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px;margin:0 0 14px}
.prow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lvl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px}
.pmid{flex:1;min-width:0}
.ptitle{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15}
.psub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{flex:none;display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.streak b{font-family:var(--font-display);font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}
.streak.on{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.streak.on b{color:var(--warn)}
.streak.risk{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.next{margin:10px 0 0;font-size:15px}
.player.slim .next,.player.slim .psub{display:none}
.player.slim .prow{margin-bottom:8px}
.lstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:6px 0 12px}
.lstats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lstats b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.lstats span{font-size:12px;color:var(--muted)}
.trophies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:6px 0 12px}
.tro{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);opacity:.75}
.tro b{display:block;font-weight:600;font-size:15px}
.tro span{font-size:12px}
.tro.got{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);opacity:1}
.tro.got b{color:var(--accent)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.pc{position:absolute;width:8px;height:8px;border-radius:2px;animation:pc .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes pc{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.xpf{position:absolute;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--accent);animation:xpf .9s ease-out forwards;white-space:nowrap}
@keyframes xpf{from{transform:translateY(0);opacity:1}to{transform:translateY(-48px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.btn:active{transform:none}#fx{display:none}.streak.risk{animation:none}}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>LSC Int'l</h1><button class="sync" id="sync" aria-live="polite" type="button"></button></div>
  <p class="take" id="take"></p>
  <div id="player"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="fx" aria-hidden="true"></div>
<script>
'use strict';
/* ---------- constants ---------- */
const RANKS=[
  {slug:'bronze-foundation',key:'bf',name:'Bronze Foundation',when:'By/before Oct 2026'},
  {slug:'bronze-builder',key:'bb',name:'Bronze Builder',when:'Nov 2026'},
  {slug:'arrow',key:'ar',name:'Arrow',when:'Jan 2027'}
];
const ROAD=RANKS.map((r)=>({id:r.key,name:r.name,when:r.when})).concat([{id:'fed',name:"Amway Platinum's FED, Jacksonville, FL",when:'Mar 2027'}]);
const STATUS=['Not started','In progress','Achieved'];
const PACE=[
  {title:'Today',reset:'Reset today',items:[
    {id:'conversations',label:'Conversations',target:3,hint:'Auto-counts partner messages logged as sent'},
    {id:'bridge_names',label:'Names for Bridge text meeting',target:7,hint:'Meeting with Evans'}]},
  {title:'This week',reset:'Reset week',items:[
    {id:'step3',label:'Step 3',target:5},
    {id:'connections',label:'Partnership connections',target:12},
    {id:'pcms',label:'PCMs',target:4,hint:'Feeds customer orders'}]},
  {title:'This month',reset:'Reset month',items:[
    {id:'pv300',label:'300pv circle',target:300,hint:'Due by the 15th of every month'},
    {id:'bre',label:'Customer orders',target:10},
    {id:'memberships',label:'Memberships',target:10}]}
];
function rankGroups(r){
  const k=r.key+'_';
  return [
    {title:'Monthly',reset:'Reset month',items:[{id:k+'pv300',label:'300pv circle',target:300,hint:'By the 15th of every month'}]},
    {title:'Weekly',reset:'Reset week',items:[{id:k+'step3',label:'Step 3',target:5},{id:k+'connections',label:'Partnership connections',target:12}]},
    {title:'Each Bridge text meeting',reset:'New meeting',items:[{id:k+'names',label:'New names',target:7}]}
  ];
}
const TABS=[{id:'pace',name:'Pace'},{id:'outreach',name:'Outreach'},{id:'playbook',name:'Playbook'}]
  .concat(RANKS.map((r)=>({id:r.slug,name:r.name,rank:r})),[{id:'trophies',name:'Trophies'},{id:'road',name:'Road'},{id:'sync',name:'Sync'}]);
const KEYS=['id','name','org','phone','email','loc','age','cat','flag','job','last','status','tag','fu'];
const PLATFORMS=['Text','Instagram','Facebook','LinkedIn','WhatsApp','Call','Email'];
const STEPS=['Connecting question','Situation','Problem awareness','Solution awareness','Commitment / PCM invite','Follow-up'];
const OUTCOMES=['','Booked call','Became customer','Became partner','Not interested'];
const FILTERS=[['due','Follow-ups due'],['batch','Day 1 batch'],['cust','Customers'],['part','Partners'],['untagged','Untagged'],['all','Everyone']];
const LS_STATE='lsc-tracker-v1',LS_CFG='lsc-sync-v1',LS_DATA='lsc-data-v1',LS_Q='lsc-queue-v1',LS_DIRTY='lsc-dirty-v1';

/* ---------- storage ---------- */
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=load(LS_STATE,{counts:{},status:{}});
if(!state.counts)state.counts={};
if(!state.status)state.status={};
let cfg=load(LS_CFG,null);
let data=load(LS_DATA,null);
let queue=load(LS_Q,[]);
let dirty=!!load(LS_DIRTY,false);
let contacts=[],byId=new Map(),batchInfo=new Map();
let tab='pace',armed=null,armTimer=null,syncMsg='',lastErr='',busy=false,again=false,timer=null,renderLater=false;
const ui={filter:'due',q:'',open:null,limit:40,form:{}};
const $app=document.getElementById('app'),$tabs=document.getElementById('tabs'),$take=document.getElementById('take'),$sync=document.getElementById('sync'),$toast=document.getElementById('toast'),$player=document.getElementById('player');
const cnt=(id)=>Number(state.counts[id])||0;

/* ---------- dates ---------- */
const pad=(n)=>String(n).padStart(2,'0');
function localToday(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
const today=()=>(data&&data.today)||localToday();
function addDays(s,n){const p=s.split('-').map(Number);const d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function timeNow(){const d=new Date();let h=d.getHours();const m=pad(d.getMinutes());const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap;}

/* ---------- sheet data ---------- */
function buildData(){
  const keys=(data&&data.keys)||KEYS;
  contacts=((data&&data.rows)||[]).map((r)=>{const o={};keys.forEach((k,i)=>{o[k]=r[i]==null?'':String(r[i]);});return o;});
  byId=new Map(contacts.map((c)=>[c.id,c]));
  batchInfo=new Map();
  const b=(data&&data.batch)||[];
  if(b.length>1){
    const h=b[0].map((x)=>String(x).toLowerCase());
    const ix=(p)=>h.findIndex((x)=>x.indexOf(p)===0);
    const c={id:ix('contact id'),type:ix('type'),ch:ix('channel'),found:ix('what i found'),draft:ix('message 1'),sent:ix('sent?')};
    b.slice(1).forEach((r,n)=>{
      const id=String(r[c.id]||'').trim();
      if(id)batchInfo.set(id,{n,type:r[c.type]||'',channel:r[c.ch]||'',found:r[c.found]||'',draft:r[c.draft]||'',sent:r[c.sent]||''});
    });
  }
}
buildData();
const settings=()=>(data&&data.settings)||{custTarget:10,partTarget:10,gap:2};
function pendingSent(){
  const p={Customer:0,Partner:0};
  queue.forEach((q)=>{if(q.action==='act'&&q.sent){const c=byId.get(q.id);if(c&&p[c.cat]!==undefined)p[c.cat]++;}});
  return p;
}
function visible(c){return !c.flag;}
function list(){
  const t=today(),q=ui.q.trim().toLowerCase();
  let rows;
  if(q){
    const digits=q.replace(/\D/g,'');
    rows=contacts.filter((c)=>(c.name+' '+c.org+' '+c.loc+' '+c.job).toLowerCase().indexOf(q)>=0||(digits.length>=3&&c.phone.replace(/\D/g,'').indexOf(digits)>=0));
  }else if(ui.filter==='due'){
    rows=contacts.filter((c)=>visible(c)&&c.fu&&c.fu<=t).sort((a,b)=>a.fu<b.fu?-1:a.fu>b.fu?1:0);
  }else if(ui.filter==='batch'){
    rows=contacts.filter((c)=>batchInfo.has(c.id)).sort((a,b)=>batchInfo.get(a.id).n-batchInfo.get(b.id).n);
  }else if(ui.filter==='cust'){rows=contacts.filter((c)=>visible(c)&&c.cat==='Customer');}
  else if(ui.filter==='part'){rows=contacts.filter((c)=>visible(c)&&c.cat==='Partner');}
  else if(ui.filter==='untagged'){rows=contacts.filter((c)=>visible(c)&&!c.tag&&c.cat==='Unverified');}
  else{rows=contacts.slice();}
  if(!q&&!['due','batch'].includes(ui.filter))rows.sort((a,b)=>a.name.localeCompare(b.name));
  return rows;
}

/* ---------- sync ---------- */
function setSync(m){syncMsg=m;$sync.textContent=m;}
function refreshSyncLabel(){
  if(!cfg){setSync('Saved on this phone');return;}
  const n=queue.length+(dirty?1:0);
  if(busy)setSync('Syncing…');
  else if(lastErr)setSync('Sync problem. Tap for details');
  else if(n)setSync(n+' waiting to sync');
  else setSync(data&&data.at?'Synced '+data.at:'Connected');
}
async function call(req){
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:cfg.token},req))});
  if(!r.ok)throw new Error('The sheet answered with an error ('+r.status+').');
  let j;
  try{j=await r.json();}catch(e){throw new Error('That link did not answer like the tracker script. Check that it is deployed with access set to Anyone.');}
  if(!j.ok)throw new Error(j.error==='unauthorized'?'The secret code does not match the one in the script.':(j.error||'The sheet reported a problem.'));
  return j;
}
function applyRead(j){

async function syncAll(){
  if(!cfg)return;
  if(busy){again=true;return;}
  busy=true;lastErr='';refreshSyncLabel();
  try{
    while(queue.length){
      await call(queue[0]);
      queue.shift();save(LS_Q,queue);
    }
    if(dirty){
      dirty=false;save(LS_DIRTY,false);
      try{await call({action:'saveTracker',state:{counts:state.counts,status:state.status}});}
      catch(e){dirty=true;save(LS_DIRTY,true);throw e;}
    }
    const j=await call({action:'read'});
    if(!j.tracker||!j.tracker.updated){
      await call({action:'saveTracker',state:{counts:state.counts,status:state.status}});
    }else if(!dirty){
      state={counts:j.tracker.counts||{},status:j.tracker.status||{}};
      save(LS_STATE,state);
    }
    applyRead(j);
  }catch(e){
    lastErr=(e&&e.message)||'Could not reach the sheet.';
    if(e instanceof TypeError)lastErr='No connection to the sheet right now. Your changes are kept and will sync when you are back online.';
  }
  busy=false;dailyRollover();autoCounts();refreshSyncLabel();softRender();
  if(again||queue.length||dirty){again=false;if(!lastErr)syncAll();}
}

function setCount(id,v,rect){
  v=Math.max(0,Math.min(100000,Math.round(Number(v)||0)));
  const old=cnt(id);if(v===old)return;
  const it=ITEMS[id],b=baseOf(id),w=WEIGHT[b]||0,g=gameBegin();
  const dailyBefore=PACE[0].items.every((x)=>cnt(x.id)>=x.target);
  state.counts[id]=v;
  if(w){
    let xp=Math.floor(v*w)-Math.floor(old*w);
    if(it){
      const was=old>=it.target,is=v>=it.target,bo=BONUS[b]||20;
      if(!was&&is){xp+=bo;g.msgs.push(it.label+' target hit. +'+bo+' bonus XP');g.big=true;if(b==='pv300')gset('g_pv',1);}
      else if(was&&!is)xp-=bo;
    }
    gset('g_xp',cnt('g_xp')+xp);g.gain=xp;
    const dl=v-old;
    if(b==='conversations')gadd('g_convos',dl);else if(b==='bre')gadd('g_orders',dl);else if(b==='memberships')gadd('g_members',dl);
    if(dl>0)markActive();
  }
  const dailyAfter=PACE[0].items.every((x)=>cnt(x.id)>=x.target),d=dayNum(today());
  if(!dailyBefore&&dailyAfter&&cnt('g_qday')!==d){gset('g_qday',d);gadd('g_xp',50);gadd('g_qcount',1);g.gain+=50;g.msgs.push('Daily quest done. +50 XP');g.big=true;}
  render();
  gameEnd(g,rect);
}
function nextMove(){
  const st=streakNow();
  const lead=(!doneToday()&&st>0)?'Do one thing today to keep your '+st+'-day streak. ':'';
  const left=PACE[0].items.map((it)=>({it:it,n:Math.max(0,it.target-cnt(it.id))})).filter((x)=>x.n>0).sort((a,b)=>a.n-b.n);
  if(left.length){
    const x=left[0];
    return lead+'Next up: '+x.n+' more '+x.it.label.charAt(0).toLowerCase()+x.it.label.slice(1)+(left.length===1?' and today\'s quest is done (+50 XP).':'.');
  }
  const o=outreachProg();
  if(cfg&&data&&!o.done){
    const parts=[];
    if(o.c<o.ct)parts.push((o.ct-o.c)+' customer');
    if(o.pa<o.pt)parts.push((o.pt-o.pa)+' partner');
    return lead+'Today\'s quest is done. Outreach left: '+parts.join(' and ')+' messages (+75 XP when you finish).';
  }

}

    h+='<section class="grp"><header><h2>Reply ladder</h2></header><p class="note">From your sheet. Customer and partner versions of each message.</p>'+
      L.slice(1).map((r)=>'<div class="ref"><h3>'+esc((r[0]||'').replace(/\n/g,' '))+'</h3>'+
        (r[1]?'<div class="who">Customer</div><p>'+esc(r[1])+'</p>':'')+(r[2]&&r[2]!==r[1]?'<div class="who">Partner</div><p>'+esc(r[2])+'</p>':'')+
        (r[3]?'<div class="who">Why it works</div><p>'+esc(r[3])+'</p>':'')+'</div>').join('')+'</section>';
  }
  const P=data.playbook||[];
  if(P.length>1){
    h+='<section class="grp"><header><h2>Reply playbook</h2></header>'+
      P.slice(1).map((r)=>'<div class="ref"><h3>'+esc(r[0]||'')+'</h3>'+(r[1]?'<div class="hint">'+esc(r[1])+'</div>':'')+
        (r[2]?'<div class="who">Customer</div><p>'+esc(r[2])+'</p>':'')+(r[3]&&r[3]!==r[2]?'<div class="who">Partner</div><p>'+esc(r[3])+'</p>':'')+'</div>').join('')+'</section>';
  }
  return h;
}
function syncHtml(){
  let h='';
  if(lastErr)h+='<p class="err" role="alert">'+esc(lastErr)+'</p>';
  h+='<section class="grp"><header><h2>Google Sheet</h2><span class="chip'+(cfg?' on':'')+'">'+(cfg?'Connected':'Not connected')+'</span></header>'+
    '<p class="note">Your counts, contacts and outreach log stay in step with your LSC_INTL_Outreach_Tracker sheet. Contacts are stored only on this phone and in your sheet, never on this web page.</p>'+
    '<div class="panel"><div class="f"><label for="cfg-url">Web app URL</label><input id="cfg-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(cfg?cfg.url:'')+'" autocomplete="off"></div>'+
    '<div class="f"><label for="cfg-token">Secret code</label><input id="cfg-token" type="password" value="'+esc(cfg?cfg.token:'')+'" autocomplete="off"></div>'+
    '<button class="primary" type="button" data-act="connect">Save and sync</button>'+
    (cfg?'<button class="ghost" type="button" data-act="syncnow">Sync now</button>':'')+
    (cfg?'<button class="ghost" type="button" data-act="disconnect">Disconnect and clear sheet data from this phone</button>':'')+
    '<p class="hint">'+(queue.length+(dirty?1:0))+' change(s) waiting to sync. '+(data&&data.at?'Last sync '+esc(data.at)+'.':'')+'</p></div></section>';
  return h;
}
function takeLine(){
  let hit=0,total=0;
  PACE.forEach((g)=>g.items.forEach((it)=>{total++;if(cnt(it.id)>=it.target)hit++;}));
  $take.innerHTML='<b>'+hit+'</b> of <b>'+total+'</b> daily, weekly and monthly targets hit';
}
function render(){
  $tabs.innerHTML=TABS.map((t)=>'<button class="tab" role="tab" data-act="tab" data-id="'+t.id+'" aria-selected="'+(t.id===tab)+'">'+t.name+'</button>').join('');
  const t=TABS.find((x)=>x.id===tab);
  let html='';
  if(t.id==='road'){
    html='<div class="grp"><header><h2>Road to Platinum</h2></header><p class="note">Tap a step to change its status.</p>'+
      ROAD.map((r)=>{const s=Number(state.status[r.id])||0;return '<button class="stat" data-act="status" data-id="'+r.id+'"><span><span class="lbl">'+esc(r.name)+'</span><br><span class="hint">'+esc(r.when)+'</span></span><span class="chip s'+s+'">'+STATUS[s]+'</span></button>';}).join('')+'</div>';
  }else if(t.id==='outreach')html=outreachHtml();
  else if(t.id==='playbook')html=playbookHtml();
  else if(t.id==='sync')html=syncHtml();
  else if(t.id==='trophies')html=trophiesHtml();
  else if(t.id==='pace')html=groupsHtml(PACE,'pace');
  else html='<p class="note">Target date: '+esc(t.rank.when)+'</p>'+groupsHtml(rankGroups(t.rank),t.id);
  $app.innerHTML=html;
  $player.innerHTML=playerHtml(t.id!=='pace'&&t.id!=='trophies');
  takeLine();refreshSyncLabel();
}
function softRender(){
  const a=document.activeElement;
  if(a&&$app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){renderLater=true;return;}
  renderLater=false;render();
}
function toast(m){
  $toast.textContent=m;$toast.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(()=>{$toast.hidden=true;},2600);
}

/* ---------- actions ---------- */
function openContact(id){
  if(ui.open===id){ui.open=null;render();return;}
  const c=byId.get(id),b=batchInfo.get(id);
  ui.open=id;
  ui.form={platform:b&&/imessage|text|sms/i.test(b.channel)?'Text':'Text',step:STEPS[0],sent:true,replied:false,outcome:'',learned:''};
  if(c&&c.status&&c.status!=='Not contacted'&&c.status!=='Messaged')ui.form.step='Follow-up';
  render();
}
function setTag(id,t){
  const c=byId.get(id);if(!c)return;
  c.tag=t;
  c.cat=t==='C'?'Customer':t==='P'?'Partner':(c.age?c.cat:'Unverified');
  save(LS_DATA,data);
  enqueue({action:'tag',id:id,tag:t});
  toast(t?('Tagged '+(t==='C'?'customer':'partner')):'Tag cleared');
  render();
}
function logIt(id){
  const f=ui.form,c=byId.get(id);if(!c)return;
  if(!f.sent&&!f.replied&&!f.outcome&&!(f.learned||'').trim()){toast('Tick sent or replied, or add a note first');return;}
  let status='';
  if(f.outcome)status=f.outcome;
  else if(f.replied)status='Replied';
  else if(f.sent&&(!c.status||c.status==='Not contacted'||c.status==='Messaged'))status='Messaged';
  const g=gameBegin(),before=outreachProg(),rect=(document.querySelector('[data-act=log]')||document.body).getBoundingClientRect();
  const op={action:'act',id:id,platform:f.platform,step:f.step,sent:!!f.sent,replied:!!f.replied,outcome:f.outcome,learned:(f.learned||'').trim(),status:status};
  if(f.sent||f.replied)c.last=today();
  if(status)c.status=status;
  c.fu=(f.sent&&!f.replied&&!f.outcome)?addDays(today(),settings().gap):(status==='Messaged'||status==='Replied')?c.fu:'';
  save(LS_DATA,data);
  enqueue(op);
  let xp=0;
  if(f.sent){xp+=8;gadd('g_msgs',1);}
  if(f.replied)xp+=20;
  if(f.outcome==='Booked call'){xp+=60;gadd('g_booked',1);}
  else if(f.outcome==='Became customer'||f.outcome==='Became partner')xp+=100;
  else if(f.outcome==='Not interested')xp+=5;
  if(xp){gadd('g_xp',xp);g.gain=xp;markActive();}
  const after=outreachProg(),dn=dayNum(today());
  if(!before.done&&after.done&&cnt('g_oday')!==dn){gset('g_oday',dn);gadd('g_xp',75);g.gain+=75;g.msgs.push('Outreach goal hit for today. +75 XP');g.big=true;}
  g.msgs.unshift(cfg?'Logged. Syncing to your sheet…':'Logged on this phone');
  ui.open=null;
  render();
  gameEnd(g,rect);
}
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(e2){}
    ta.remove();
  }
  const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>{btn.textContent=old;},1400);
}
$tabs.addEventListener('click',(e)=>{const b=e.target.closest('[data-act=tab]');if(!b)return;tab=b.dataset.id;armed=null;render();});
$sync.addEventListener('click',()=>{tab='sync';render();});
$app.addEventListener('click',(e)=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='inc'||a==='dec'){setCount(id,cnt(id)+(a==='inc'?1:-1),b.getBoundingClientRect());}
  else if(a==='status'){state.status[id]=((Number(state.status[id])||0)+1)%STATUS.length;touch();render();}
  else if(a==='reset'){
    const gs=tab==='pace'?PACE:rankGroups(TABS.find((x)=>x.id===tab).rank);
    const key=tab+b.dataset.g;
    if(armed!==key){armed=key;clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;render();},3000);render();return;}
    clearTimeout(armTimer);armed=null;
    gs[Number(b.dataset.g)].items.forEach((it)=>{state.counts[it.id]=0;});
    touch();render();
  }
  else if(a==='filter'){ui.filter=id;ui.q='';ui.open=null;ui.limit=40;render();}
  else if(a==='more'){ui.limit+=40;document.getElementById('olist').innerHTML=listHtml();}
  else if(a==='open'){openContact(id);}
  else if(a==='tag'){setTag(id,b.dataset.tag);}
  else if(a==='log'){logIt(id);}
  else if(a==='copy'){
    const bi=batchInfo.get(ui.open);
    if(bi){const parts=bi.draft.split(/\n/).map((l)=>l.replace(/^Bubble\s*\d+:\s*/i,'').trim()).filter(Boolean);copyText(parts[Number(b.dataset.i)]||'',b);}
  }
  else if(a==='goto'){tab=id;render();}
  else if(a==='connect'){
    const url=document.getElementById('cfg-url').value.trim(),token=document.getElementById('cfg-token').value.trim();
    if(!/^https:\/\/script\.google\.com\/.+/.test(url)){lastErr='Paste the Web app URL from Apps Script. It starts with https://script.google.com/';render();return;}
    if(!token){lastErr='Enter the secret code from the top of the script.';render();return;}
    cfg={url:url,token:token};save(LS_CFG,cfg);lastErr='';
    syncAll().then(()=>{if(!lastErr){tab='outreach';toast('Connected. Your sheet is synced.');}render();});
  }
  else if(a==='syncnow'){syncAll();}
  else if(a==='disconnect'){
    cfg=null;data=null;queue=[];dirty=false;lastErr='';
    try{[LS_CFG,LS_DATA,LS_Q,LS_DIRTY].forEach((k)=>localStorage.removeItem(k));}catch(e){}
    buildData();render();toast('Disconnected. Sheet data removed from this phone.');
  }
});
$app.addEventListener('input',(e)=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;ui.limit=40;ui.open=null;document.getElementById('olist').innerHTML=listHtml();}
  else if(t.dataset&&t.dataset.f){ui.form[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;}
});
$app.addEventListener('change',(e)=>{const t=e.target;if(t.dataset&&t.dataset.cnt){const r=t.getBoundingClientRect();t.blur();setCount(t.dataset.cnt,t.value,r);return;}
  if(t.dataset&&t.dataset.f)ui.form[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;});
$app.addEventListener('focusin',(e)=>{if(e.target.dataset&&e.target.dataset.cnt)setTimeout(()=>{try{e.target.select();}catch(_){}},0);});
$app.addEventListener('focusout',()=>{setTimeout(()=>{if(renderLater)softRender();},0);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(dailyRollover())softRender();syncAll();}});
window.addEventListener('online',()=>syncAll());

/* ---------- start ---------- */
dailyRollover();
render();
if(cfg)syncAll();
</script>
</body></html>
